name: CI Quality Gate & Security Pipeline

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Lint, Build, and Test (Supabase & Workflows)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Application Dependencies
        run: npm ci

      - name: Run Typecheck & Static Lint
        run: npm run lint

      - name: Compile & Build Application Bundle
        run: npm run build

      - name: Validate Bundle Size (Gzip < 300 kB)
        run: |
          # Check main bundle sizes - fail if any initial bundle exceeds 300 kB gzip
          FAILED=0
          for file in dist/assets/index-*.js dist/assets/vendor-*.js; do
            if [ -f "$file" ]; then
              SIZE=$(gzip -c "$file" | wc -c)
              SIZE_KB=$((SIZE / 1024))
              if [ $SIZE_KB -gt 300 ]; then
                echo "❌ Bundle size exceeded: $(basename $file) = ${SIZE_KB}kB (limit: 300kB)"
                FAILED=1
              else
                echo "✓ $(basename $file) = ${SIZE_KB}kB"
              fi
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "Bundle size validation failed"
            exit 1
          fi

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Run SQL Tests (Supabase Migrations)
        run: npm run test:rules:emulator && npm run seed:emulator

      - name: Install Playwright Browser
        run: npx playwright install --with-deps

      - name: Run E2E Tests (Playwright)
        run: npm run test:e2e

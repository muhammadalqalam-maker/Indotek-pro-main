<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12352B" />
      <stop offset="100%" stop-color="#091E18" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Construction Building silhouette & Crane -->
  <g fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Crane mast and jib -->
    <path d="M120 400 L120 120 L380 120 L300 200" />
    <path d="M120 180 L200 120" />
    <path d="M200 180 L280 120" />
    <path d="M380 120 L380 160" />
    <!-- Hook -->
    <path d="M380 160 L380 190 A10 10 0 0 1 370 200" />
  </g>
  <!-- Building blocks / Structure -->
  <g fill="url(#gold)">
    <rect x="220" y="240" width="80" height="160" rx="8" opacity="0.9" />
    <rect x="320" y="290" width="80" height="110" rx="8" opacity="0.8" />
    <rect x="140" y="320" width="60" height="80" rx="8" opacity="0.7" />
  </g>
  <!-- Ground foundation -->
  <rect x="90" y="400" width="332" height="16" rx="8" fill="#FFFFFF" opacity="0.85" />
  <!-- Brand text letter I / P motif -->
  <circle cx="260" cy="200" r="16" fill="#10B981" />
</svg>
